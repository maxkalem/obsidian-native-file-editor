name: Release

# Obsidian convention: the release tag is the manifest version WITHOUT a "v"
# prefix (for example `0.1.0`), and `main.js`, `manifest.json` and `styles.css`
# are attached as top-level release assets. The workflow creates a DRAFT; a
# person publishes it.
on:
  push:
    tags: ["[0-9]+.[0-9]+.[0-9]+"]
  # Manual re-run. A tag push is a one-shot event: if the run never happened
  # (Actions disabled at the time, a GitHub incident), pick the TAG in the
  # "Run workflow" ref dropdown. The version check below compares the ref name
  # with manifest.json, so choosing a branch fails immediately and says why.
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Verify tag matches manifest version
        run: |
          MV=$(jq -r .version manifest.json)
          [ "$MV" = "${GITHUB_REF_NAME}" ] \
            || { echo "Tag ${GITHUB_REF_NAME} != manifest version $MV"; exit 1; }

      # build-plugin.yml does not run on a push, so this is the only automatic
      # check of it on the release path. Obsidian reads versions.json to decide
      # which build an older app may install, so a missing entry is not cosmetic.
      - name: Version consistency (manifest vs package vs versions.json)
        run: |
          MV=$(jq -r .version manifest.json)
          PV=$(jq -r .version package.json)
          [ "$MV" = "$PV" ] || { echo "manifest.json ($MV) != package.json ($PV)"; exit 1; }
          jq -e --arg v "$MV" 'has($v)' versions.json >/dev/null \
            || { echo "versions.json has no entry for $MV"; exit 1; }

      - name: Install dependencies (locked)
        run: npm ci

      - name: Tests (unit + e2e)
        run: |
          npm test
          npm run test:e2e

      - name: Build plugin
        run: npm run build

      - name: Committed artifacts must match the build exactly
        run: |
          git diff --exit-code -- main.js manifest.json styles.css versions.json \
            native-file-editor/main.js native-file-editor/manifest.json native-file-editor/styles.css

      - name: Bundle size report
        run: npm run size

      - name: Attest build provenance for the plugin assets
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css

      - name: Create GitHub release (draft)
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          draft: true
          generate_release_notes: true
          files: |
            main.js
            manifest.json
            styles.css
